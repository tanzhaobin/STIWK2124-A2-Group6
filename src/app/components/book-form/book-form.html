<h2>📝 Book Entry Form</h2>
<a routerLink="/books">⬅ Back to List</a>

<div class="form-container">
  <div class="form-header">
    <h2>{{ isEditMode ? '✏️ Edit Book Details' : '➕ Add New Book Entry' }}</h2>
    <p>Please populate the parameters below to update the repository database catalog.</p>
  </div>

  <form (ngSubmit)="saveBook()" #bookForm="ngForm">
    <div class="form-group">
      <label for="title">Book Title</label>
      <input 
        type="text" 
        id="title" 
        name="title" 
        [(ngModel)]="book.title" 
        required 
        placeholder="e.g., Software Engineering Principles"
      />
    </div>

    <div class="form-group">
      <label for="author">Author Name</label>
      <input 
        type="text" 
        id="author" 
        name="author" 
        [(ngModel)]="book.author" 
        required 
        placeholder="e.g., Ian Sommerville"
      />
    </div>

    <div class="form-group">
      <label for="price">Retail Price ($)</label>
      <input 
        type="number" 
        id="price" 
        name="price" 
        [(ngModel)]="book.price" 
        required 
        step="0.01"
        placeholder="0.00"
      />
    </div>

    <div class="form-group">
      <label for="isbn">ISBN Code</label>
      <input 
        type="text" 
        id="isbn" 
        name="isbn" 
        [(ngModel)]="book.isbn" 
        required 
        placeholder="e.g., 978-0133943030"
      />
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-cancel" [routerLink]="['/books']">Cancel</button>
      <button type="submit" class="btn btn-submit" [disabled]="!bookForm.form.valid">
        {{ isEditMode ? 'Update Record' : 'Save Book' }}
      </button>
    </div>
  </form>
</div>
